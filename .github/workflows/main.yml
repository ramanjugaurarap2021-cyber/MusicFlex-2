name: Build MusicFlex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract MusicFlex project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Fix Java/Kotlin compatibility
        shell: bash
        run: |
          cd extracted/MusicFlexOffline

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Fix Kotlin lambda error
        shell: bash
        run: |
          cd extracted/MusicFlexOffline

          sed -i 's/runOnUiThread { if (controller == null) pending.addLast(action) else action() }/runOnUiThread { if (controller == null) pending.addLast { action() } else action() }/' app/src/main/java/com/musicflex/app/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build MusicFlex APK
        shell: bash
        run: |
          cd extracted/MusicFlexOffline
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlex-5.2-debug
          path: extracted/MusicFlexOffline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
